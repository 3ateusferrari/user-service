# Database Properties
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Properties
spring.flyway.baseline-on-migrate=true

# JWT Properties
app.jwt-secret=123123123
app.jwt-expiration-milliseconds=3600000
app.jwt-refresh-expiration-milliseconds=2592000000

# Logging
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Management / Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Info Endpoint Metadata
info.app.name=User Service
info.app.description=Microservice for User Authorization and Management
info.app.version=0.0.1-SNAPSHOT
